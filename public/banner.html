<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
    <title>Kitestring reminder</title>
    <link rel="stylesheet" href="/banner.css">
    <script src="/banner.js" defer></script>
  </head>
  <body>
    <strong id="label">Focus complete</strong>
    <nav aria-label="Reminder actions">
      <button type="button" id="continue">Take a break</button>
      <button type="button" id="stop">Stop</button>
      <button type="button" id="open">Open Kitestring</button>
      <button type="button" id="dismiss" aria-label="Dismiss reminder">Dismiss</button>
    </nav>
  </body>
</html>
